[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-writing-detector"
version = "1.0.0"
description = "Deterministic linting for common AI-writing tells in customer-facing copy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christian Terrone"}]
dependencies = []

[project.scripts]
ai-writing-detector = "ai_writing_detector.cli:main"

[tool.setuptools.packages.find]
include = ["ai_writing_detector*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
